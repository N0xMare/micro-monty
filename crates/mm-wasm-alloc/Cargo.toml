[package]
name = "mm-wasm-alloc"
description = "std's wasm32-unknown-unknown allocator (dlmalloc) without the per-site validate_size checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
exclude.workspace = true
publish = false

# The same dlmalloc std links on this target (library/Cargo.lock), so the
# allocator's behaviour is std's; only the inlined checks go.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
dlmalloc = { version = "=0.2.14", default-features = false }

# The workspace lints, except `unsafe_code`: `deny`, allowed only on the
# `GlobalAlloc` impl and its `Sync` (docs/spec.md §5).
[lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "deny"
unused_lifetimes = "deny"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
