[package]
name = "mm-cli"
description = "micro-monty command-line runner (`mm run`, `mm exec --json`)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
exclude.workspace = true
publish = false

[[bin]]
name = "mm"
path = "src/main.rs"

[dependencies]
# The optional stdlib modules, for the conformance runs.
micro-monty = { workspace = true, features = ["mod-uuid", "mod-unicodedata", "mod-html-entities", "mod-ast"] }
serde_json.workspace = true

# On musl, mimalloc instead of musl's malloc (mallocng), which maps and
# unmaps every block of 128 KiB or more (docs/user-guide.md, "musl").
# Built from C: needs musl-gcc (.cargo/config.toml, .agents/setup).
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1.52", default-features = false }

[lints]
workspace = true
