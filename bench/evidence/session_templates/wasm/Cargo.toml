[package]
name = "session-templates-wasm"
description = "Session templates through mm-wasm-host (docs/research/session-templates.md)"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
publish = false

# Its own workspace, like crates/mm-wasm-host (wasmtime stays out of the root lockfile).
[workspace]

[[bin]]
name = "wasm-tpl"
path = "main.rs"

[dependencies]
mm-wasm-host = { path = "../../../../crates/mm-wasm-host" }
serde_json = "1"

[profile.release]
opt-level = 3
