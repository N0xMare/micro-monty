[package]
name = "restore-cost"
description = "Restore and snapshot cost per MiB of image, native and wasm32-wasip1 (docs/sdk.md, docs/spec.md §9.3)"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
publish = false

# Its own workspace, so the harness never enters the engine's build,
# lockfile or size budget. It links the unchanged facade as an embedder does.
[workspace]

[[bin]]
name = "restore-cost"
path = "main.rs"

[dependencies]
micro-monty = { path = "../../../crates/micro-monty" }

# The root workspace's release profile, as the facade ships.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.mm-parse]
opt-level = "z"

[profile.release.package.mm-compile]
opt-level = "s"

[profile.release.package.micro-monty]
opt-level = "z"
strip = true
