[package]
name = "mm-soak-wasm"
description = "The soak on the mm-wasm guest through crates/mm-wasm-host (bench/evidence/soak/README.md)"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
publish = false

# Its own workspace, like crates/mm-wasm-host (wasmtime stays out of the root lockfile).
[workspace]

[[bin]]
name = "soak-wasm"
path = "main.rs"

[dependencies]
mm-wasm-host = { path = "../../../../crates/mm-wasm-host" }
# The same facade mm-wasm-host uses, for `HostError` in `Resume::Batch`.
micro-monty = { path = "../../../../crates/micro-monty" }
serde_json = "1"

[profile.release]
opt-level = 3
debug = "line-tables-only"
