[package]
name = "engines-micropython"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
common = { package = "engines-common", path = "../../../engines/hosts/common" }

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
