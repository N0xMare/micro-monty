[package]
name = "engines-monty"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
common = { package = "engines-common", path = "../../../engines/hosts/common" }
monty = { git = "https://github.com/pydantic/monty", tag = "v1.5.0" }
monty-types = { git = "https://github.com/pydantic/monty", tag = "v1.5.0" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
