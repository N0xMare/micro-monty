[package]
name = "wasm-base"
description = "Fresh-session images from the mm-wasm v1 guest (wasm32-unknown-unknown, wasm32-wasip1) and the native facade, for the determinism check in docs/research/base-relative-snapshots.md"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

# Its own workspace, like crates/mm-wasm-host (wasmtime stays out of the root lockfile).
[workspace]

[[bin]]
name = "wasm-base"
path = "main.rs"

[dependencies]
micro-monty = { path = "../../../../crates/micro-monty" }
mm-wasm-host = { path = "../../../../crates/mm-wasm-host" }
