[package]
name = "engines-mm-wasm"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

# crates/mm-wasm-host (the reference wasmtime host) running the shipped
# mm-wasm guest (`$MM_WASM_GUEST`, `cargo xtask size` output).
[dependencies]
common = { package = "engines-common", path = "../common" }
mm-wasm-host = { path = "../../../../../crates/mm-wasm-host" }
micro-monty = { path = "../../../../../crates/micro-monty" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
