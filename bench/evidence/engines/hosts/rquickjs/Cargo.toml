[package]
name = "engines-rquickjs"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
common = { package = "engines-common", path = "../common" }
rquickjs = { version = "=0.14.0", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[features]
snapshots = []
