[package]
name = "engines-common"
version = "0.0.0"
edition = "2024"
publish = false

# Shared by every engine host (one Cargo workspace per host, so each engine keeps
# its own dependency graph); not a workspace of its own.

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
zstd = { version = "0.13", default-features = false }
