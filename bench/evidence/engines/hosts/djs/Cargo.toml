[package]
name = "engines-djs"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

# djs-core and djs-prelude at the pinned djs checkout (README "Pins"), with
# their default features, as djs's own native CLI and bench/evidence/djs.
[dependencies]
common = { package = "engines-common", path = "../common" }
djs-core = { path = "/tmp/eng/djs/crates/djs-core" }
djs-prelude = { path = "/tmp/eng/djs/crates/djs-prelude" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
