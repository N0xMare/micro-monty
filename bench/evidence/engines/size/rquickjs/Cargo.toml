[package]
name = "size-rquickjs"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
rquickjs = "=0.14.0"

# The repo's release profile (Cargo.toml), as `cargo xtask size` builds
# `hello`: built by ../build.sh with std rebuilt for immediate abort.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
