[package]
name = "iso-harness"
description = "Drives the three isolation modes: performance and the fault matrix"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["wasm"]
# The wasmtime mode. Off for the shipped (`panic=immediate-abort`) native build.
wasm = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:mm-wasm-host"]

[dependencies]
iso-service.workspace = true
micro-monty.workspace = true
serde.workspace = true
serde_json.workspace = true
wasmtime = { version = "50", optional = true }
wasmtime-wasi = { version = "50", optional = true }
mm-wasm-host = { path = "../../../../crates/mm-wasm-host", optional = true }

# macOS has no /proc or prlimit: proc_pid_rusage, getrusage and setrlimit.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
