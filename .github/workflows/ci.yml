name: CI

# Runs on release tags only (owner, 2026-11-08): pushes to main are verified
# locally (`cargo xtask check`, its landing tier or release gate as AGENTS.md
# says, and the other gates there). A `v*` tag runs the release gate and the
# other gates beside release.yml's draft release, as the release's CI record;
# the owner publishes only if both pass. Run it by hand from the
# Actions tab before tagging. The tools come from `.agents/setup` (the pinned
# toolchain, CPython 3.14.7, wasmtime, binaryen).
# By hand: `gh workflow run ci.yml --ref main`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # wasm-wall builds the previous release tag
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Tools (.agents/setup)
        run: |
          ./.agents/setup
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
      # The release gate (AGENTS.md): check's stages in release profiles with
      # durability at 1:1000, plus the shipped mm-wasm guests against the
      # reference host (wasm-host) and the codemode workload outcomes.
      - name: Every local gate, the release gate (cargo xtask check --release-gate)
        run: cargo xtask check --release-gate
      - name: Gate logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: target/check/logs/
      - name: Wasm wall time against the previous release (cargo xtask wasm-wall)
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          if [ -n "$previous" ]; then
            cargo xtask wasm-wall --base "$previous"
          else
            echo "wasm-wall: no earlier release tag to compare with"
          fi
      - name: Fuzz targets build
        run: cargo check --manifest-path fuzz/Cargo.toml --features memory-probes --bins
      # Not in `cargo xtask check` (owner, 2026-11-09): the advisory database
      # is fetched over the network, so the result can change with no commit.
      - name: Supply chain (cargo deny, deny.toml)
        run: |
          cargo deny --all-features check
          cargo deny --all-features --manifest-path fuzz/Cargo.toml check
          cargo deny --all-features --manifest-path crates/mm-wasm-host/Cargo.toml check
