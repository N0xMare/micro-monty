[package]
name = "dispatch"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
publish = false
description = "Spike S1: throwaway interpreter-dispatch benchmark for micro-monty (not shipped)"

# Own workspace: this package is not a member of the micro-monty workspace
# (the root Cargo.toml also lists `spikes` under `exclude`).
[workspace]

[features]
default = []
# Count dispatched instructions (adds one increment per dispatch; never time this build).
count = []
# Replace bounds-checked code/frame/arena reads and writes with `get_unchecked`.
# Measurement only: it is the only place `unsafe` appears (src/access.rs) and it
# is unsound for untrusted bytecode. The default build forbids `unsafe`.
unchecked = []

# Same as the root workspace's release profile.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
