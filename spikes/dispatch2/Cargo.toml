[package]
name = "dispatch2"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
publish = false
description = "Spike S2: redesigned execution core for micro-monty (not shipped)"

# Own workspace, like spike S1: not a member of the micro-monty workspace
# (the root Cargo.toml lists `spikes` under `exclude`).
[workspace]

[features]
default = ["full_hot"]
# Seventeen more hot opcodes in the dispatch loop (compare family, fused
# compare-jumps, MUL, attribute/method ICs, list indexing, STA_DEREF, NEG,
# NOT, `is`, list append) that the kernels do not execute: a realistic hot
# set for register allocation. `--no-default-features` = the lean loop.
full_hot = []
# Count dispatched instructions (one increment per dispatch; never time it).
count = []
# Unrelated-edit probes for the stability measurement (docs/spikes/dispatch2.md):
perturb_arm = []    # one extra hot arm the kernels never execute
perturb_order = []  # RETURN arm moved to the top of the match
perturb_field = []  # an extra field in `Vm`
perturb_cold = []   # ten more cold opcodes in `cold_op`
perturb_slow = []   # an edit inside a slow path (`arith_slow`)

# Same as the root workspace's release profile.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
